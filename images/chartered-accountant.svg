<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="80" height="80">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1e40af" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="#2563eb" opacity="0.9"/>
  
  <!-- Document/Certificate icon -->
  <rect x="60" y="50" width="80" height="100" fill="white" rx="5"/>
  
  <!-- Seal circle -->
  <circle cx="100" cy="120" r="20" fill="#ffcc00"/>
  <circle cx="100" cy="120" r="15" fill="#1e40af"/>
  
  <!-- Lines on document -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="#2563eb" stroke-width="3"/>
  <line x1="70" y1="85" x2="130" y2="85" stroke="#2563eb" stroke-width="2"/>
  <line x1="70" y1="95" x2="110" y2="95" stroke="#2563eb" stroke-width="2"/>
  
  <!-- CA text -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">CA</text>
  
  <!-- Bottom text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">CHARTERED</text>
</svg>